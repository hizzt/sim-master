name: sim-master release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/techblack/sim-master

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: artifacts
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./release/${{ matrix.arch }}
          cache-from: type=gha,scope=sim-master-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sim-master-${{ matrix.arch }}

      - name: Package and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          test -x "release/${{ matrix.arch }}/simadmin"
          test -x "release/${{ matrix.arch }}/simadmin-vowifi-helper"
          test -f "release/${{ matrix.arch }}/www/index.html"
          tar -czf "release/sim-master-${{ matrix.arch }}.tar.gz" \
            -C "release/${{ matrix.arch }}" simadmin simadmin-vowifi-helper www LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "release/sim-master-${{ matrix.arch }}.tar.gz" > "release/sim-master-${{ matrix.arch }}.tar.gz.sha256"
          file "release/${{ matrix.arch }}/simadmin"

      - name: Upload architecture bundle
        uses: actions/upload-artifact@v4
        with:
          name: sim-master-${{ matrix.arch }}
          path: |
            release/sim-master-${{ matrix.arch }}.tar.gz
            release/sim-master-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(tr -d '[:space:]' < VERSION)"
            fi
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z]+)*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download architecture bundles
        uses: actions/download-artifact@v4
        with:
          pattern: sim-master-*
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: sim-master v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/sim-master-x86_64.tar.gz
            release/sim-master-x86_64.tar.gz.sha256
            release/sim-master-arm64.tar.gz
            release/sim-master-arm64.tar.gz.sha256

  image:
    name: Publish multi-arch container image
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=sim-master-image
            type=gha,scope=sim-master-x86_64
            type=gha,scope=sim-master-arm64
          cache-to: type=gha,mode=max,scope=sim-master-image
